{% extends "base.html" %}

{% block title %}
Sign Up - StudySync
{% endblock %}

{% block content %}

<div class="auth-wrap">

    <div class="auth-container">

        <div class="auth-head">
            <h1>Create Your Account</h1>
            <p>Join StudySync and start studying smarter.</p>
        </div>

        <div class="auth-card">
            <form method="POST">

                <div>
                    <label for="fullname">Full name</label>
                    <input id="fullname" type="text" name="fullname" placeholder="Enter your full name" required>
                </div>

                <div>
                    <label for="email">Email</label>
                    <input id="email" type="email" name="email" placeholder="Enter your email" required>
                </div>

                <div>
                    <label for="password">Password</label>
                    <input id="password" type="password" name="password" placeholder="Enter your password" required>
                </div>

                <div>
                    <label for="confirm_password">Confirm password</label>
                    <input id="confirm_password" type="password" name="confirm_password" placeholder="Re-enter password" required>
                </div>

                <button class="btn">Sign Up</button>
            </form>
        </div>

        <p class="auth-alt">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>

    </div>

</div>

{% endblock %}
